[project]
name = "dinatos-mcp"
version = "0.1.0"
description = "MCP server exposing the Dinatos API as tools for an LLM harness"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    # v1's FastMCP API -- v2 renamed it to MCPServer with a different
    # surface (see mcp.server.fastmcp's own ModuleNotFoundError on v2).
    "mcp>=1.6,<2",
    "pydantic-settings>=2.5",
]

[project.scripts]
dinatos-mcp = "dinatos_mcp.__main__:main"

[dependency-groups]
dev = [
    # Only for tests: spins up the real FastAPI app in-process (ASGI
    # transport, no network) so the proxy is exercised against the real
    # /mcp endpoint instead of hand-rolled fixtures -- same idea
    # as backend/tests/conftest.py's own `client` fixture.
    "dinatos-backend",
    "aiosqlite>=0.20",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv.sources]
dinatos-backend = { path = "../backend", editable = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinatos_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov --cov-report=term-missing"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["dinatos_mcp"]
branch = true
# See backend/pyproject.toml's own comment on this -- same async/greenlet
# bridge applies to httpx's async engine here.
concurrency = ["greenlet"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
mypy_path = ["src", "tests"]
explicit_package_bases = true
