# Dinatos — copy this next to your other self-hosted services.
#
# Binds to localhost only; point your existing reverse proxy at it for
# anything reachable outside this host.
#
#   cp .env.example .env   # then edit it
#   just docker up
#
# See docs/deploy/quickstart.md.

name: dinatos

services:
  postgres:
    image: postgres:16-alpine
    container_name: dinatos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dinatos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set this in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dinatos}
    volumes:
      - dinatos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dinatos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  # Backend + the built Flutter web app, served together from one origin --
  # `http://127.0.0.1:8000` is both the API and the app itself, so there's
  # nothing else to build or serve separately. See docs/deploy/clients.md
  # for a client build served from its own origin instead.
  backend:
    build: .
    image: dinatos:local
    container_name: dinatos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DINATOS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dinatos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dinatos}
      DINATOS_ALLOW_REGISTRATION: ${DINATOS_ALLOW_REGISTRATION:-true}
      DINATOS_ADMIN_EMAIL: ${DINATOS_ADMIN_EMAIL:-}
      DINATOS_ADMIN_PASSWORD: ${DINATOS_ADMIN_PASSWORD:-}
      DINATOS_WORKOUTX_API_KEY: ${DINATOS_WORKOUTX_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  dinatos-postgres-data:
