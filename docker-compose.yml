# Dinatos — copy this next to your other self-hosted services.
#
# Binds to localhost only; point your existing reverse proxy at it for
# anything reachable outside this host.
#
#   cp .env.example .env   # then edit it
#   just docker up
#
# See docs/deploy/quickstart.md.

name: dinatos

services:
  # One-shot, as root: makes sure the data directory exists and belongs to
  # DINATOS_UID:DINATOS_GID. Without it, Docker creates a missing bind-mount
  # directory owned by root, which the (non-root) postgres below can't write.
  postgres-init:
    image: postgres:16
    container_name: dinatos-postgres-init
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c", "mkdir -p /data/postgres && chown ${DINATOS_UID:-1000}:${DINATOS_GID:-1000} /data/postgres && chmod 700 /data/postgres"]
    volumes:
      - ${DINATOS_DATA_DIR:-./data}:/data

  postgres:
    # Debian-based, not -alpine: only this variant can run under an
    # arbitrary UID that has no /etc/passwd entry (via nss_wrapper).
    image: postgres:16
    container_name: dinatos-postgres
    restart: unless-stopped
    user: "${DINATOS_UID:-1000}:${DINATOS_GID:-1000}"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dinatos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set this in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dinatos}
    volumes:
      - ${DINATOS_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dinatos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  # Backend + the built Flutter web app, served together from one origin --
  # `http://127.0.0.1:8000` is both the API and the app itself, so there's
  # nothing else to build or serve separately. See docs/deploy/clients.md
  # for a client build served from its own origin instead.
  backend:
    build: .
    image: dinatos:local
    container_name: dinatos
    restart: unless-stopped
    # Overrides the image's built-in 10001:10001, so no rebuild is needed.
    user: "${DINATOS_UID:-1000}:${DINATOS_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DINATOS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dinatos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dinatos}
      DINATOS_ALLOW_REGISTRATION: ${DINATOS_ALLOW_REGISTRATION:-true}
      DINATOS_ADMIN_EMAIL: ${DINATOS_ADMIN_EMAIL:-}
      DINATOS_ADMIN_PASSWORD: ${DINATOS_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
