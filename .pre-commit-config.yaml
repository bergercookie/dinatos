# `just hooks` installs these; `just lint` and CI run them over the whole tree.
#
# ruff, mypy and tach all run from the backend's own locked virtualenv rather
# than a pinned mirror repo, so there is exactly one version of each tool in
# the project and a hook can never disagree with `uv run`.
# Pinned, so pre-commit never asks nodeenv for "latest". When Node published
# 27.0.0-alpha, nodeenv before 1.12 failed to parse that version and every
# Node hook (markdownlint-cli2) failed to install. A pin also makes the hook's
# environment the same on every machine. Raise it to a newer LTS on purpose.
default_language_version:
  node: 24.22.0

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      # Shell scripts: a shebang means it must be executable and vice versa.
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        # The vendored free-exercise-db dataset (~1MB of exercise metadata,
        # see backend/src/dinatos_backend/data/NOTICE.md) is legitimate,
        # deliberate, and the only thing over the default 500KB -- excluded
        # by path rather than raising the limit for everything else.
        exclude: ^backend/src/dinatos_backend/data/free_exercise_db\.json$

  # hadolint isn't a Python tool, so unlike ruff/mypy/tach below it can't run
  # from the backend's own uv-managed venv -- this pulls the prebuilt hadolint
  # binary via a pinned wheel instead, the same way pre-commit-hooks above is
  # pinned rather than local.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  # Shell scripts (backend/docker-entrypoint.sh, packaging/linux/*.sh,
  # tools/*.sh). Like hadolint these ship as prebuilt-binary wheels, so no
  # system shellcheck/shfmt is needed. shellcheck finds bugs (quoting, unset
  # vars, bad portability for the POSIX `#!/bin/sh` entrypoint); shfmt only
  # checks formatting (-d prints the diff and fails, never rewrites).
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=style, --external-sources]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.11.0-1
    hooks:
      - id: shfmt
        args: [--diff, --indent, "2"]

  # Markdown (README, AGENTS.md, docs/). Check-only: markdownlint-cli2 is run
  # without --fix so it can never rewrite MyST syntax the Sphinx build relies
  # on. Rules are configured in .markdownlint-cli2.yaml.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # GitHub Actions workflows: actionlint type-checks expressions, `needs:`
  # references, action inputs and runs shellcheck over `run:` scripts -- none
  # of which check-yaml can see. Prebuilt binary via a PyPI wheel mirror, like
  # hadolint/shellcheck above.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        # actionlint shellchecks every `run:` script, but only when shellcheck
        # is on PATH. CI runners have it and most machines do not, so the hook
        # brings its own (same version as the shellcheck hook above).
        additional_dependencies: ["shellcheck-py==0.10.0.1"]

  - repo: local
    hooks:
      # ruff runs from the repo root against the root pyproject.toml, so it
      # covers everything under backend/, mcp_server/, screenshots/ and e2e/ alike
      # -- ruff itself needs no runtime dependencies, unlike mypy below, so
      # it isn't limited by screenshots/ using its own uv dependency group.
      # Markdown is in the trigger because ruff formats the Python blocks
      # inside docs too.
      - id: ruff-check
        name: ruff (lint + pyupgrade)
        entry: uv run --project backend ruff check --fix .
        language: system
        files: ^(backend|mcp_server|screenshots|e2e)/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff (format)
        entry: uv run --project backend ruff format .
        language: system
        files: (^(backend|mcp_server|screenshots|e2e)/.*\.py$|\.md$)
        pass_filenames: false
      - id: mypy
        name: mypy (strict, backend)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy-mcp-server
        name: mypy (strict, mcp_server)
        entry: bash -c 'cd mcp_server && uv run mypy'
        language: system
        files: ^mcp_server/.*\.py$
        pass_filenames: false
      - id: tach
        name: tach (module boundaries)
        entry: bash -c 'cd backend && uv run tach check'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      # Offline only: relative links and anchors between the Markdown files,
      # no network, so it is near-instant and can't flake. External URLs are
      # checked by `just check-links` / the `links` workflow instead. lychee
      # is installed from its official PyPI wheel (lychee-bin, prebuilt, works
      # on old glibc unlike the official hook's cargo-binstall download); keep
      # the version in step with `check-links` in the root justfile.
      - id: lychee-offline
        name: lychee (offline Markdown links)
        entry: lychee --offline --no-progress --config lychee.toml
        language: python
        additional_dependencies: ["lychee-bin==0.24.2"]
        files: \.md$
      # Prose style for the docs (README, CONTRIBUTING, docs/): passive voice,
      # weasel words, sentences starting with "So" or "There is", spelling.
      # Rules and vocabulary live in .vale.ini and .vale/styles/ (write-good is
      # vendored there, so the hook needs no `vale sync` and no network for
      # styles). The vale wheel fetches its binary on first use.
      - id: vale
        name: vale (documentation prose)
        entry: vale
        language: python
        additional_dependencies: ["vale==3.26.0.1"]
        files: ^(README|CONTRIBUTING)\.md$|^docs/.*\.md$
        exclude: ^docs/_build/
        require_serial: true  # the wheel downloads its binary on first run
      # Link to the Sphinx site, not to a file view on GitHub: the docs site is
      # the primary way to read these pages, and GitHub's Markdown view is a
      # bonus (README, CONTRIBUTING.md and SECURITY.md use absolute site URLs, so
      # both render). Issues, releases and advisories are GitHub features and are
      # fine. AGENTS.md and SECURITY.md are published as pages in docs/.
      - id: no-github-file-links
        name: docs link to the site, not GitHub file views
        entry: 'github\.com/bergercookie/dinatos/(blob|tree)/'
        language: pygrep
        files: \.md$
        exclude: ^docs/_build/
