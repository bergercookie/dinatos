[project]
name = "dinatos-backend"
version = "0.1.0"
description = "Dinatos workout tracker API"
requires-python = ">=3.12"
dependencies = [
    # >=1.16 for reading [tool.alembic] out of pyproject.toml (Config's
    # `toml_file` argument) -- see [tool.alembic] below.
    "alembic>=1.16",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.29",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    # A runtime dependency, not just a test/dev one: services/tutorials/workoutx.py
    # imports it unconditionally (services/tutorials/__init__.py imports
    # WorkoutXProvider at module load regardless of whether WorkoutX is
    # actually configured), so a production install needs it too.
    "httpx2>=2.13.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
dinatos-backend = "dinatos_backend.__main__:main"

[dependency-groups]
# Building the documentation. Kept out of `dev` so a normal sync stays small.
docs = [
    "furo>=2024.8",
    "myst-parser>=4.0",
    "sphinx>=8.1",
]
# A fresh, throwaway Postgres for anything that needs one without touching
# a developer's own -- shared by the migrations test suite (`dev`, below)
# and ../screenshots/generate.py (`screenshots`, below), so it's its own
# group rather than duplicated in both.
testing-infra = [
    "testcontainers[postgres]>=4.15.0",
]
dev = [
    "aiosqlite>=0.20",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-alembic>=0.13.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "tach>=0.16",
    {include-group = "testing-infra"},
]
# ../screenshots/generate.py borrows this project's venv (like `docs` does
# for Sphinx) rather than being its own uv project -- one lockfile, and it
# already needs `testing-infra` and the backend package itself.
screenshots = [
    "playwright>=1.48",
    {include-group = "testing-infra"},
]

# ../e2e/ (Playwright against the real web build) borrows this project's venv
# the same way, for the same reasons.
e2e = [
    "playwright>=1.48",
    {include-group = "testing-infra"},
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinatos_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage is on by default so a plain `pytest` enforces the same gate as CI.
# The HTML report (htmlcov/, gitignored) is written on every run so CI can
# upload it as an artifact from the same run that enforces the gate.
addopts = "-v --cov --cov-report=term-missing --cov-report=html"
filterwarnings = [
    # Our own warnings are bugs; third-party deprecations are not ours to fix.
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["dinatos_backend"]
branch = true
# SQLAlchemy's async engine bridges the DBAPI through greenlet; without this,
# coverage loses track of any line reached after the first `await` on a
# session call in the same function -- a whole tail of very real code looks
# untested.
concurrency = ["greenlet"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "tests_migrations"]
strict = true
warn_unreachable = true
mypy_path = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# Its own conftest.py would otherwise collide with tests/conftest.py as the
# same top-level module name ("conftest") -- neither directory is a package.
module = "tests_migrations.*"
follow_imports = "skip"

[tool.alembic]
# Everything Alembic itself needs, except logging -- see alembic.ini for why
# that one piece stays there. `%(here)s` is this file's own directory.
script_location = "%(here)s/alembic"
