# Only logging configuration lives here. Everything else Alembic itself
# needs (script_location, etc.) is `[tool.alembic]` in pyproject.toml --
# alembic reads both a .ini and pyproject.toml together, but Python's
# `logging.config.fileConfig()`, which env.py calls with this file, only
# understands the .ini format, so this one piece has nowhere else to go.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
