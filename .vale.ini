# Prose linter for the Markdown docs (README, CONTRIBUTING, docs/).
# Run with `just vale`; also a pre-commit hook. Code spans and fenced code
# blocks are ignored by Vale itself.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Dinatos
Packages = write-good

[*.md]
BasedOnStyles = Vale, write-good

# The docs follow ASD-STE100: "to be" and "it is" are normal there. write-good's
# E-Prime and wordiness rules fight that, so both are off.
write-good.E-Prime = NO
write-good.TooWordy = NO
