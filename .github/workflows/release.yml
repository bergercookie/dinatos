name: Release

# A pushed tag (v1.2.3) is the only trigger -- nothing here runs on every
# push to main, unlike ci.yml. `version` computes the release version once
# so every other job (and the GitHub Release itself) uses the exact same
# string, rather than each re-deriving it from the tag independently.
#
# Also callable (`workflow_call`) from nightly.yml, which cuts a dated
# prerelease; a tag pushed with the default GITHUB_TOKEN never triggers
# another workflow, so nightly.yml can't just push a tag and rely on the
# trigger above.
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Tag the GitHub Release is created at (created if missing)
        type: string
        required: true
      version:
        description: Package version; defaults to the tag without its leading "v"
        type: string
        default: ''
      prerelease:
        description: Mark the GitHub Release as a prerelease and skip the Docker `latest` tag
        type: boolean
        default: false

permissions:
  contents: write # to create the GitHub Release
  packages: write # to push the app image to GHCR

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        # Debian/APK versioning doesn't accept a leading "v" (dpkg-deb
        # rejects it outright); the Docker tag and GitHub Release both use
        # the same stripped form too, so every artifact in one release
        # agrees on a single version string.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ inputs.version }}
        run: echo "version=${VERSION:-${TAG#v}}" >> "$GITHUB_OUTPUT"

  docker:
    needs: version
    runs-on: ubuntu-latest
    # The frontend-builder stage fetches and runs the Flutter SDK on top of
    # the usual backend build, so this takes noticeably longer than a
    # backend-only image did.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # Repo root, not backend/: the Dockerfile's frontend-builder stage
          # needs frontend/ too -- see the Dockerfile's own top comment.
          context: .
          push: true
          # amd64 only (see the project's release notes) -- add
          # linux/arm64 here if that ever changes; it needs QEMU
          # (docker/setup-qemu-action) too, not just another platform string.
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          # `latest` only moves on a stable release; nightlies move `nightly`.
          tags: |
            ghcr.io/${{ github.repository_owner }}/dinatos:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/dinatos:${{ inputs.prerelease && 'nightly' || 'latest' }}

  android-apk:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: extractions/setup-just@v4
      # ubuntu-latest already carries an Android SDK/NDK for exactly this;
      # nothing extra to install, unlike the Linux desktop job below.
      # A stable signing key is required for the APK to install over an
      # earlier version; without these secrets the build falls back to the
      # per-machine debug key and updates fail on devices.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set; the APK would not be updatable"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > frontend/android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > frontend/android/key.properties
      - name: Build release APK
        run: just packaging build-apk "${{ needs.version.outputs.version }}" "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dinatos-${{ needs.version.outputs.version }}-android
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux-packages:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: extractions/setup-just@v4
      # Flutter Linux desktop's own build + runtime needs: GTK3 (the
      # renderer's windowing toolkit) and libsecret (flutter_secure_storage's
      # backing store on Linux) -- see AGENTS.md's "Frontend needs the
      # Flutter SDK" section for how these were discovered.
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - name: Build Linux packages
        run: just packaging build-linux-artifacts "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: dinatos-${{ needs.version.outputs.version }}-linux
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, docker, android-apk, linux-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Excludes the "<owner>~<repo>~<id>.dockerbuild" artifact that
          # docker/build-push-action@v6 (buildx) auto-uploads for GitHub's
          # build-summary UI: an unnamed pattern here also matches that one,
          # and downloading it reliably fails after 5 retries, which fails
          # this whole job and skips the release step below -- every tagged
          # run so far built and pushed all four artifacts successfully but
          # never actually created a GitHub Release because of this.
          pattern: dinatos-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || false }}
          name: Dinatos ${{ needs.version.outputs.version }}
          files: artifacts/*
          body: |
            Docker image (backend + web UI, one container): `ghcr.io/${{ github.repository_owner }}/dinatos:${{ needs.version.outputs.version }}`

            See [`docs/deploy/index.md`](docs/deploy/index.md) for how to run it and point a browser (or a native client) at it.
