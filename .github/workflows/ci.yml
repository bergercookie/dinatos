name: CI

# Pull requests cover feature branches; pushes cover main. Triggering on both
# for every branch would run the whole suite twice per push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Before `just install`, which would re-lock and hide the drift.
      - run: just backend::check-lockfile
      - run: just mcp_server::check-lockfile
      - name: Install dependencies
        # The ruff/mypy/tach hooks run through `uv run`, so the backend's
        # (and mcp_server's own) virtualenv has to exist before the hooks start.
        run: just install
      - run: just check
      # Per-file coverage tables on the run's summary page (no service/token).
      - if: always()
        run: |
          for pkg in backend mcp_server; do
            echo "### $pkg coverage" >> "$GITHUB_STEP_SUMMARY"
            (cd $pkg && uv run coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY") || true
          done
      - if: always()
        run: python3 .github/scripts/coverage_report.py collect coverage-python.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage-python.json
          if-no-files-found: ignore
      # pytest writes backend/htmlcov/ on every run (see addopts in
      # backend/pyproject.toml); `if: always()` keeps the report when the
      # coverage gate itself is what failed.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: backend/htmlcov/
          if-no-files-found: ignore

  migrations:
    # Separate from `check`: this needs Docker (for testcontainers) and its
    # own real seconds, which is exactly why it isn't part of `just check`
    # locally either -- see AGENTS.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just install
      - run: just backend::test-migrations

  frontend:
    # Also separate from `check`: the Flutter SDK is a much heavier, non-uv
    # dependency, and `just check`/`just install` at the repo root are
    # documented (AGENTS.md) as needing nothing but Python, uv and just --
    # adding it there would break that for anyone working on the backend
    # alone.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: extractions/setup-just@v4
      - run: just frontend::install
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lcov
      # `check` minus its plain `test`: `coverage` runs the same suite with
      # --coverage, so this doesn't run it twice.
      - run: just frontend::check-format
      - run: just frontend::analyze
      - run: just frontend::coverage
      - if: always()
        run: |
          awk -F: '/^LF:/{t+=$2} /^LH:/{h+=$2} END{if(t) printf "### frontend coverage\n\nLine coverage: %.2f%% (%d/%d)\n", 100*h/t, h, t}' frontend/coverage/lcov.info >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        run: python3 .github/scripts/coverage_report.py collect coverage-frontend.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage-frontend.json
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-html
          path: frontend/coverage/html/
          if-no-files-found: ignore

  e2e:
    # Like `screenshots`, needs the Flutter SDK, Docker and Playwright's
    # browser -- its own job rather than part of `just check`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: extractions/setup-just@v4
      - run: just e2e::install
      - run: just e2e::lint
      - run: just e2e::test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: /tmp/dinatos-e2e-*.png
          if-no-files-found: ignore

  coverage:
    # Merges the numbers the jobs above collected and, on a pull request,
    # comments them next to the latest ones from main. Runs on main too, to
    # leave those numbers behind as an artifact for the next pull request.
    needs: [check, frontend]
    if: always() && needs.check.result != 'cancelled' && needs.frontend.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: parts
          merge-multiple: false
      - name: Merge
        run: |
          python3 - <<'PY'
          import json, pathlib
          merged = {}
          for part in pathlib.Path("parts").glob("*/*.json"):
              merged.update(json.loads(part.read_text()))
          pathlib.Path("coverage.json").write_text(json.dumps(merged))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: coverage-main
          path: coverage.json
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        # Pull requests from forks get a read-only token, so the comment can
        # fail there; the numbers are still on each job's summary.
        continue-on-error: true
        run: |
          run_id=$(gh run list --workflow ci.yml --branch main --event push --status completed --limit 20 \
            --json databaseId --jq '.[].databaseId' | while read -r id; do
              if gh run download "$id" --name coverage-main --dir base 2>/dev/null; then echo "$id"; break; fi
            done)
          python3 .github/scripts/coverage_report.py comment coverage.json base/coverage.json > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md --edit-last --create-if-none
