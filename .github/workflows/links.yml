name: Links

# External URLs rot independently of our commits, so this is deliberately not
# part of ci.yml's blocking `check` job: it runs weekly, on demand, and on PRs
# that touch Markdown or the checker's own config (the offline pre-commit hook
# in `just check` already covers relative links and anchors).
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'
      - lychee.toml
      - .github/workflows/links.yml

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v4
      - run: just check-links
